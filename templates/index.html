<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midas AI Engine | Unicorn Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg-color: #0f0c29; --accent-color: #00d2ff; --sell-color: #ff4757; --buy-color: #2ed573; }
        
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white; font-family: 'Noto Sans KR', sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            margin: 0; overflow-y: auto; padding: 40px 20px; box-sizing: border-box;
        }

        .background-orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.4; z-index: -1; animation: float 10s infinite ease-in-out; }
        .orb-1 { width: 300px; height: 300px; background: #ff00cc; top: 10%; left: 20%; }
        .orb-2 { width: 400px; height: 400px; background: #333399; bottom: 10%; right: 10%; animation-delay: -5s; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }

        .glass-container {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2.5rem; width: 100%; max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); text-align: center; height: auto;
        }

        h1 { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; margin-bottom: 0.5rem; background: linear-gradient(to right, #00d2ff, #3a7bd5); -webkit-background-clip: text; background-clip: text; color: transparent; }
        
        .toggle-container { display: flex; background: rgba(0,0,0,0.3); border-radius: 30px; padding: 5px; margin-bottom: 20px; position: relative; }
        .toggle-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #aaa; font-weight: bold; cursor: pointer; z-index: 2; transition: color 0.3s; border-radius: 25px; }
        .toggle-btn.active { color: white; }
        .toggle-bg { position: absolute; top: 5px; left: 5px; width: 50%; height: calc(100% - 10px); background: var(--buy-color); border-radius: 25px; transition: all 0.3s ease; z-index: 1; }
        
        /* 🆕 카테고리 선택기 스타일 */
        .category-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        .cat-btn { 
            padding: 10px 2px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: #ccc; cursor: pointer; font-size: 0.75rem; 
            transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .cat-btn.active { 
            background: var(--accent-color); color: white; border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
        }

        input { width: 100%; padding: 15px; border-radius: 15px; border: 2px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; margin-bottom: 15px; outline: none; box-sizing: border-box; }
        input:focus { border-color: var(--accent-color); }
        
        button.action-btn { width: 100%; padding: 15px; border-radius: 15px; border: none; background: var(--accent-color); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        
        .progress-wrapper { display: none; margin: 20px 0; }
        .progress-bar-bg { width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--accent-color); transition: width 0.3s ease; box-shadow: 0 0 10px var(--accent-color); }
        .progress-text { font-size: 0.9rem; color: #aaa; margin-top: 5px; }

        .result-box { display: none; margin-top: 20px; text-align: left; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from {opacity:0; transform:translateY(20px);} to {opacity:1;} }
        
        .price-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .target-price { font-size: 2rem; font-weight: bold; text-align: center; margin: 20px 0; text-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        .map-btn { margin-top: 10px; width: 100%; padding: 12px; background: #03c75a; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .ai-reason { background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: 10px; font-size: 0.85rem; color: #ddd; line-height: 1.6; border-left: 3px solid var(--accent-color); margin-top: 15px; }
    </style>
</head>
<body>
    <div class="background-orb orb-1"></div>
    <div class="background-orb orb-2"></div>

    <div class="glass-container">
        <h1>MIDAS ENGINE</h1>
        <p style="color:#aaa; font-size:0.8rem; margin-bottom:20px;">AI Category-Specific Pricing System</p>

        <div class="toggle-container">
            <div class="toggle-bg" id="toggleBg"></div>
            <button class="toggle-btn active" onclick="setMode('buy')" id="btnBuy">🛒 구매</button>
            <button class="toggle-btn" onclick="setMode('sell')" id="btnSell">💰 판매</button>
        </div>

        <div class="category-container" id="categoryContainer">
            <button class="cat-btn active" onclick="setCat('general', this)"><i class="fa-solid fa-house-laptop"></i>가전/생활</button>
            <button class="cat-btn" onclick="setCat('car', this)"><i class="fa-solid fa-car-side"></i>차량</button>
            <button class="cat-btn" onclick="setCat('house', this)"><i class="fa-solid fa-city"></i>주택</button>
            <button class="cat-btn" onclick="setCat('cloth', this)"><i class="fa-solid fa-shirt"></i>의류</button>
            <button class="cat-btn" onclick="setCat('book', this)"><i class="fa-solid fa-book"></i>도서</button>
            <button class="cat-btn" onclick="setCat('etc', this)"><i class="fa-solid fa-ellipsis"></i>기타</button>
        </div>

        <input type="text" id="productInput" placeholder="검색어를 입력하세요..." onkeypress="if(event.key==='Enter') startAnalysis()">
        
        <button onclick="startAnalysis()" id="analyzeBtn" class="action-btn">분석 시작</button>

        <div class="progress-wrapper" id="progressWrapper">
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
            <div class="progress-text" id="progressText">대기 중... 0%</div>
        </div>

        <div class="result-box" id="resultBox">
            <div class="price-row"><span style="color:#2db400">N 네이버 평균</span><span id="avgPrice">-</span></div>
            <div class="price-row" id="bungaeRow" style="display:none;"><span style="color:#d63031">⚡ 번개장터 평균</span><span id="bungaePrice">-</span></div>
            <div class="target-price" id="targetPriceDisplay"></div>
            <button id="mapBtn" class="map-btn"><i class="fa-solid fa-map-location-dot"></i> 매장 찾기</button>
            <div class="ai-reason" id="aiReason"></div>
        </div>
    </div>

    <script>
        let currentMode = 'buy';
        let selCat = 'general'; // 🆕 기본 카테고리
        let pollingInterval = null;

        function setMode(mode) {
            currentMode = mode;
            const bg = document.getElementById('toggleBg');
            bg.style.left = (mode === 'buy') ? '5px' : '50%';
            bg.style.background = (mode === 'buy') ? '#2ed573' : '#ff4757';
            document.getElementById('analyzeBtn').style.background = (mode === 'buy') ? '#2ed573' : '#ff4757';
        }

        function setCat(c, b) {
            selCat = c;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            b.classList.add('active');
        }

        async function startAnalysis() {
            const product = document.getElementById('productInput').value;
            if (!product) return alert("검색어를 입력하세요!");

            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('progressWrapper').style.display = 'block';
            document.getElementById('analyzeBtn').disabled = true;

            const response = await fetch('/start_analysis', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({product: product, mode: currentMode, category: selCat})
            });
            const d = await response.json();
            pollStatus(d.task_id);
        }

        function pollStatus(taskId) {
            pollingInterval = setInterval(async () => {
                const res = await fetch(`/status/${taskId}`);
                const s = await res.json();
                document.getElementById('progressBar').style.width = s.progress + "%";
                document.getElementById('progressText').innerText = `${s.message} (${s.progress}%)`;

                if (s.progress >= 100) {
                    clearInterval(pollingInterval);
                    document.getElementById('progressWrapper').style.display = 'none';
                    document.getElementById('analyzeBtn').disabled = false;
                    if (s.result) showResult(s.result);
                }
            }, 1000);
        }

        function showResult(data) {
        document.getElementById('resultBox').style.display = 'block';
        const fmt = n => new Intl.NumberFormat('ko-KR').format(n) + "원";
        
        // 1. 가격 표시
        document.getElementById('avgPrice').innerText = fmt(data.market_price.avg);
        const bRow = document.getElementById('bungaeRow');
        if (data.bungae_price.avg > 0) {
            bRow.style.display = 'flex';
            document.getElementById('bungaePrice').innerText = fmt(data.bungae_price.avg);
        }
        
        // 2. 추천 가격 및 색상 (구매/판매 확연히 구분)
        const targetDiv = document.getElementById('targetPriceDisplay');
        const isBuy = data.mode === 'buy';
        targetDiv.style.color = isBuy ? '#2ed573' : '#ff4757';
        targetDiv.innerHTML = `
            <small style="display:block; color:#aaa; font-size:1rem;">
                ${isBuy ? '💰 지금 사면 좋은 가격' : '💎 지금 팔면 좋은 가격'}
            </small>
            ${fmt(data.recommendation.target_price)}
        `;

        document.getElementById('aiReason').innerText = data.ai_analysis.reason;
    }
    </script>
</body>
</html>
